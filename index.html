<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1117'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%2331c4d6' text-anchor='middle'%3ERR%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ravani Roshan — AI systems builder. Autonomous agents, hermetic sandboxes, token budgets, and deterministic policy runtimes."
    />
    <title>Ravani Roshan — AI Systems Builder</title>
    <script>
      // Resolve theme + column alignment before first paint so the narrow
      // column never flashes at the wrong offset or in the wrong mode.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("rr:theme") || '"dark"');
          if (t !== "dark") document.documentElement.classList.remove("dark");
          var a = JSON.parse(localStorage.getItem("rr:align") || '"left"');
          var map = {
            left: ["0px", "auto", "none", "1px solid"],
            center: ["auto", "auto", "1px solid", "1px solid"],
            right: ["auto", "0px", "1px solid", "none"],
          }[a] || ["0px", "auto", "none", "1px solid"];
          var s = document.documentElement.style;
          s.setProperty("--column-ml", map[0]);
          s.setProperty("--column-mr", map[1]);
          s.setProperty("--column-bl", map[2] + " currentColor");
          s.setProperty("--column-br", map[3] + " currentColor");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
