<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">RS monogram</title>
  <desc id="desc">A warm initials mark for Roshan Singh.</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4c38b" />
      <stop offset="1" stop-color="#8c4f24" />
    </linearGradient>
    <linearGradient id="ring" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4e4" stop-opacity="0.85" />
      <stop offset="1" stop-color="#f7d8b0" stop-opacity="0.35" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" />
  <rect x="7" y="7" width="50" height="50" rx="13" fill="none" stroke="url(#ring)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="22" fill="#2c1608" fill-opacity="0.14" />
  <text
    x="32"
    y="38"
    text-anchor="middle"
    font-family="JetBrains Mono, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace"
    font-size="23"
    font-weight="700"
    letter-spacing="-1.5"
    fill="#fff7ec"
  >
    RS
  </text>
</svg>
